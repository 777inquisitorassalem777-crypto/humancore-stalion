[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humancore-stalion"
version = "0.1.0"
description = "Simulation-only research core with explicit policy checks"
requires-python = ">=3.10"

[project.scripts]
humancore = "humancore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
